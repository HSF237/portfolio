<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost in orbit — Muhammad Hasan</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{--bg:#ECE8FF;--ink:#17123F;--muted:#5E5890;--coral:#E0336A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0B24;--ink:#EEEAFF;--muted:#9C96C9;--coral:#FF5C8A}}
:root[data-theme="dark"]{--bg:#0D0B24;--ink:#EEEAFF;--muted:#9C96C9;--coral:#FF5C8A}
*{margin:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;overflow:hidden;padding:1.5rem}
.blob{position:fixed;width:min(80vw,520px);aspect-ratio:1;left:50%;top:44%;translate:-50% -50%;z-index:0;filter:blur(2px) saturate(1.3);
  background:conic-gradient(from 0deg,#3B2BD9,#5BE3FF,#FF5C8A,#FFD166,#3B2BD9);border-radius:42% 58% 63% 37%/45% 38% 62% 55%;opacity:.85;
  animation:morph 9s ease-in-out infinite,spin 24s linear infinite}
@keyframes morph{0%,100%{border-radius:42% 58% 63% 37%/45% 38% 62% 55%}33%{border-radius:63% 37% 41% 59%/58% 62% 38% 42%}66%{border-radius:37% 63% 55% 45%/36% 49% 51% 64%}}
@keyframes spin{to{rotate:360deg}}
main{position:relative;z-index:1;text-align:center;max-width:36rem}
h1{font-family:"Anybody","Arial Narrow",sans-serif;font-weight:900;font-size:clamp(7rem,38vw,16rem);line-height:.8;letter-spacing:-.05em;color:var(--bg);-webkit-text-stroke:2px var(--ink);animation:stretch 3s ease-in-out infinite alternate}
@keyframes stretch{from{font-variation-settings:"wdth" 60}to{font-variation-settings:"wdth" 140}}
p{font-size:clamp(1.1rem,3.5vw,1.4rem);margin:1.5rem 0 2rem}
a{display:inline-flex;align-items:center;min-height:3.4rem;padding:0 1.6rem;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none;transition:background .3s}
a:hover{background:var(--coral);color:#fff}
@media (prefers-reduced-motion:reduce){.blob,h1{animation:none}}
</style>
</head>
<body>
<div class="blob" aria-hidden="true"></div>
<main>
  <h1>404</h1>
  <p>This page drifted out of orbit. Even art needs the right URL.</p>
  <a href="/portfolio/">Back to the portfolio</a>
</main>
</body>
</html>
